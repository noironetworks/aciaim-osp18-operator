[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file = /tmp/aim-supervisord.sock

[supervisorctl]
serverurl = unix:///tmp/aim-supervisord.sock
prompt = ciscoaci-aim

[supervisord]
identifier = aim-supervisor
pidfile = /run/aid/aim-supervisor.pid
{{if .LogToDisk}}logfile = /var/log/aim/aim-supervisor-%(ENV_POD_ORDINAL)s.log
logfile_maxbytes = 10MB
logfile_backups = 3
childlogdir = /var/log/aim
{{else}}logfile = /dev/stdout
logfile_maxbytes = 0
logfile_backups = 0
childlogdir = /tmp
{{end}}loglevel = debug
umask = 022
minfds = 1024
minprocs = 200
nodaemon = true
nocleanup = false
strip_ansi = false

[program:aim-aid]
command=/usr/bin/aim-aid --config-file=/etc/aim/aim.conf{{if .LogToDisk}} --log-file=/var/log/aim/aim-aid-%(ENV_POD_ORDINAL)s.log{{end}}
exitcodes=0,2
stopasgroup=true
startsecs=0
startretries=3
stopwaitsecs=10
autorestart=true
{{if .LogToDisk}}stdout_logfile=NONE
stderr_logfile=NONE
{{else}}stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
{{end}}
[program:aim-event]
command=/usr/bin/aim-event-service-polling --config-file=/etc/aim/aim.conf{{if .LogToDisk}} --log-file=/var/log/aim/aim-event-service-polling-%(ENV_POD_ORDINAL)s.log{{end}}
exitcodes=0,2
stopasgroup=true
startsecs=10
startretries=3
stopwaitsecs=10
autorestart=true
{{if .LogToDisk}}stdout_logfile=NONE
stderr_logfile=NONE
{{else}}stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
{{end}}
[program:aim-rpc]
command=/usr/bin/aim-event-service-rpc --config-file=/etc/aim/aim.conf{{if .LogToDisk}} --log-file=/var/log/aim/aim-event-service-rpc-%(ENV_POD_ORDINAL)s.log{{end}}
exitcodes=0,2
stopasgroup=true
startsecs=10
startretries=3
stopwaitsecs=10
autorestart=true
{{if .LogToDisk}}stdout_logfile=NONE
stderr_logfile=NONE
{{else}}stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
{{end}}
